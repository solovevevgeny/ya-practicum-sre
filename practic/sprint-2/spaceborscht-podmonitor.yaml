---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: spaceborscht-control
  namespace: spaceborscht
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - spaceborscht
  selector:
    matchLabels:
      app: control
  podMetricsEndpoints:
    - targetPort: 3000
      path: /metrics
  
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
