  namespace: spaceborscht
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - spaceborscht 
  selector:
    matchLabels:
      app: engine
  podMetricsEndpoints:
    - targetPort: 3001 
      path: /metrics
  
---
apiVersion: monitoring.coreos.com/v1
